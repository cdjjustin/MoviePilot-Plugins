[project]
name = "moviepilot-plugin-audiobookorganizer"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.47.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[tool.moviepilot.dependency-gate]
platforms = ["linux-x64", "linux-arm64", "windows-x64", "macos-arm64"]
